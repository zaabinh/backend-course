<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Scheduler App</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 1150px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header { margin-bottom: 28px; }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin-top: 8px;
            color: #6b7280;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 28px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }

        textarea {
            min-height: 220px;
            font-family: Consolas, monospace;
            resize: vertical;
        }

        .full { grid-column: 1 / -1; }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .btn-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .btn-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        .send-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .radio-card {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
        }

        .radio-card input {
            width: auto;
            margin-top: 4px;
        }

        .radio-card small {
            display: block;
            margin-top: 4px;
            color: #6b7280;
        }

        .schedule-time-box {
            display: block;
        }

        .table-wrapper { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            background: #f9fafb;
            color: #374151;
            font-size: 14px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: top;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }

        .badge-active {
            background: #dcfce7;
            color: #166534;
        }

        .badge-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 130px;
        }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 28px;
        }

        @media (max-width: 760px) {
            .grid { grid-template-columns: 1fr; }
            .form-actions { flex-direction: column; }
            .send-options { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="header">
        <h1>Email Scheduler App</h1>
        <p>Create, edit, send now, enable, disable, and delete scheduled HTML emails.</p>
    </div>

    <div class="card">
        <form id="emailForm">
            <input type="hidden" id="jobId">

            <div class="grid">
                <div>
                    <label>Recipient Email</label>
                    <input type="email" id="recipient" required placeholder="user@example.com">
                </div>

                <div>
                    <label>Subject</label>
                    <input type="text" id="subject" required placeholder="Email subject">
                </div>

                <div>
                    <label>Schedule Type</label>
                    <select id="scheduleType">
                        <option value="ONCE">Send once</option>
                        <option value="HOURLY">Every hour</option>
                        <option value="DAILY">Every day</option>
                        <option value="WEEKLY">Every week</option>
                    </select>
                </div>

                <div id="scheduleTimeBox" class="schedule-time-box">
                    <label>First Send Time</label>
                    <input type="datetime-local" id="firstSendTime">
                </div>

                <div class="full">
                    <label>Send Option</label>

                    <div class="send-options">
                        <label class="radio-card">
                            <input type="radio" name="sendOption" value="IMMEDIATE" checked>
                            <span>
                                <strong>Send immediately</strong>
                                <small>Email will be sent right after saving.</small>
                            </span>
                        </label>

                        <label class="radio-card">
                            <input type="radio" name="sendOption" value="SCHEDULED">
                            <span>
                                <strong>Send at scheduled time</strong>
                                <small>Email will be sent based on First Send Time.</small>
                            </span>
                        </label>
                    </div>
                </div>

                <div class="full">
                    <label>Email HTML Content</label>
                    <textarea id="content" required><h2>Hello!</h2><p>This is a scheduled email.</p><a href="https://example.com">Open Link</a></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit" id="submitBtn">Save Email Schedule</button>
                <button class="btn btn-secondary" type="button" onclick="resetForm()">Clear Form</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>Scheduled Emails</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Recipient</th>
                    <th>Subject</th>
                    <th>Type</th>
                    <th>Next Send Time</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="jobsTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/email';

    document.querySelectorAll('input[name="sendOption"]').forEach(radio => {
        radio.addEventListener('change', updateSendOptionUI);
    });

    function updateSendOptionUI() {
        const sendOption = document.querySelector('input[name="sendOption"]:checked').value;
        const firstSendTimeInput = document.getElementById('firstSendTime');

        if (sendOption === 'IMMEDIATE') {
            firstSendTimeInput.required = false;
        } else {
            firstSendTimeInput.required = true;
        }
    }

    document.getElementById('emailForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const id = document.getElementById('jobId').value;
        const sendOption = document.querySelector('input[name="sendOption"]:checked').value;
        const firstSendTimeValue = document.getElementById('firstSendTime').value;

        if (sendOption === 'SCHEDULED' && !firstSendTimeValue) {
            alert('Please choose First Send Time.');
            return;
        }

        const payload = {
            recipient: document.getElementById('recipient').value,
            subject: document.getElementById('subject').value,
            scheduleType: document.getElementById('scheduleType').value,
            firstSendTime: sendOption === 'IMMEDIATE'
                ? new Date().toISOString().slice(0, 19)
                : firstSendTimeValue,
            content: document.getElementById('content').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        const response = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const savedJob = await response.json();

        if (sendOption === 'IMMEDIATE') {
            await fetch(`${API_URL}/${savedJob.id}/send-now`, {
                method: 'POST'
            });

            alert('Email sent immediately!');
        } else {
            alert('Email scheduled successfully!');
        }

        resetForm();
        loadJobs();
    });

    async function loadJobs() {
        const response = await fetch(API_URL);
        const jobs = await response.json();

        const table = document.getElementById('jobsTable');
        table.innerHTML = '';

        if (jobs.length === 0) {
            table.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">No scheduled emails yet.</td>
                </tr>
            `;
            return;
        }

        jobs.forEach(job => {
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${job.id}</td>
                <td>${escapeHtml(job.recipient)}</td>
                <td>${escapeHtml(job.subject)}</td>
                <td><strong>${job.scheduleType}</strong></td>
                <td>${job.nextSendTime || '-'}</td>
                <td>
                    <span class="badge ${job.active ? 'badge-active' : 'badge-inactive'}">
                        ${job.active ? 'Active' : 'Inactive'}
                    </span>
                </td>
                <td>
                    <div class="actions">
                        <button class="btn btn-primary" onclick="sendNow(${job.id})">Send Now</button>
                        <button class="btn btn-secondary" onclick='editJob(${JSON.stringify(job)})'>Edit</button>
                        <button class="btn btn-warning" onclick="toggleJob(${job.id})">Enable/Disable</button>
                        <button class="btn btn-danger" onclick="deleteJob(${job.id})">Delete</button>
                    </div>
                </td>
            `;

            table.appendChild(row);
        });
    }

    async function sendNow(id) {
        await fetch(`${API_URL}/${id}/send-now`, {
            method: 'POST'
        });

        alert('Email sent successfully!');
    }

    function editJob(job) {
        document.getElementById('jobId').value = job.id;
        document.getElementById('recipient').value = job.recipient;
        document.getElementById('subject').value = job.subject;
        document.getElementById('scheduleType').value = job.scheduleType;
        document.getElementById('firstSendTime').value = job.firstSendTime || '';
        document.getElementById('content').value = job.content;

        document.querySelector('input[name="sendOption"][value="SCHEDULED"]').checked = true;
        updateSendOptionUI();

        document.getElementById('submitBtn').textContent = 'Update Email Schedule';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function toggleJob(id) {
        await fetch(`${API_URL}/${id}/toggle-active`, {
            method: 'PATCH'
        });

        loadJobs();
    }

    async function deleteJob(id) {
        if (!confirm('Are you sure you want to delete this scheduled email?')) {
            return;
        }

        await fetch(`${API_URL}/${id}`, {
            method: 'DELETE'
        });

        loadJobs();
    }

    function resetForm() {
        document.getElementById('emailForm').reset();
        document.getElementById('jobId').value = '';
        document.getElementById('submitBtn').textContent = 'Save Email Schedule';
        document.querySelector('input[name="sendOption"][value="IMMEDIATE"]').checked = true;
        updateSendOptionUI();
    }

    function escapeHtml(value) {
        if (!value) return '';

        return value
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    updateSendOptionUI();
    loadJobs();
</script>
</body>
</html>
